# ArgoCD: your Application pins the chart with spec.source.targetRevision.
# ArgoCD does not update chart versions on its own, so this workflow bumps the file and opens a PR.
name: valley-auto-update
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: current
        run: echo "version=$(yq '.spec.source.targetRevision' argo/valley.yaml)" >> "$GITHUB_OUTPUT"

      - id: valley
        uses: Rein-Security/valley-update-action@v1
        with:
          channel: stable
          current-version: ${{ steps.current.outputs.version }}
          registry-username: ${{ secrets.REIN_REGISTRY_USER }}
          registry-password: ${{ secrets.REIN_REGISTRY_PASSWORD }}

      - if: steps.valley.outputs.changed == 'true'
        run: yq -i '.spec.source.targetRevision = "${{ steps.valley.outputs.target-version }}"' argo/valley.yaml

      - if: steps.valley.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: valley ${{ steps.valley.outputs.target-version }}"
          commit-message: "chore: valley ${{ steps.valley.outputs.target-version }}"
          branch: valley-update
          body: "Rein promoted Valley ${{ steps.valley.outputs.target-version }} (digest ${{ steps.valley.outputs.target-digest }})."
