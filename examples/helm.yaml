# Plain Helm: a runner with cluster access upgrades the release directly.
# No pull request and no review step, so use this only if you accept that trade-off.
name: valley-auto-update
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest   # or a self-hosted runner that can reach your cluster
    steps:
      - uses: actions/checkout@v4

      - name: Configure cluster access
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"

      - id: current
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: echo "version=$(helm list -n valley -o json | jq -r '.[] | select(.name=="valley") | .chart' | sed 's/^valley-//')" >> "$GITHUB_OUTPUT"

      - id: valley
        uses: Rein-Security/valley-update-action@v1
        with:
          channel: stable
          current-version: ${{ steps.current.outputs.version }}
          registry-username: ${{ secrets.REIN_REGISTRY_USER }}
          registry-password: ${{ secrets.REIN_REGISTRY_PASSWORD }}

      - if: steps.valley.outputs.changed == 'true'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          printf '%s' "${{ secrets.REIN_REGISTRY_PASSWORD }}" | helm registry login hub.reinsec.app --username "${{ secrets.REIN_REGISTRY_USER }}" --password-stdin
          helm upgrade valley "${{ steps.valley.outputs.chart-ref }}" \
            --version "${{ steps.valley.outputs.target-version }}" \
            -n valley -f values.yaml --reuse-values --wait
